name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Restore Web and smoke tests
        run: |
          dotnet restore src/DungeonDefense.Web/DungeonDefense.Web.csproj
          dotnet restore tests/DungeonDefense.Web.Tests/DungeonDefense.Web.Tests.csproj
      - name: Test production build adapter
        run: dotnet test tests/DungeonDefense.Web.Tests/DungeonDefense.Web.Tests.csproj -c Release --no-restore
      - name: Resolve Chrome
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || true)"
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"
      - name: Browser playable-flow smoke
        run: node scripts/browser-smoke.mjs
      - name: Publish
        run: dotnet publish src/DungeonDefense.Web/DungeonDefense.Web.csproj -c Release --no-restore -o publish
      - name: Prepare static Pages artifact
        run: touch publish/wwwroot/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
